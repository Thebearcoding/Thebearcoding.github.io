<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">推荐请求的数据流与反馈闭环</title>
<desc id="desc">全库经召回得到四千个候选，粗排保留四百，精排打分，重排展示二十个。曝光日志返回数据、训练和实验；数量仅为教学构造。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#89776b"/></marker></defs>
<rect width="1100" height="420" rx="20" fill="#f5f3ec"/>
<g font-family="PingFang SC, Noto Sans SC, sans-serif" fill="#28241f">
<text x="42" y="48" font-size="23" font-weight="600">一次请求，四段计算预算</text>
<text x="42" y="78" font-size="15" fill="#74695f">先保证候选覆盖，再判断单条价值，最后选择整个列表</text>
<g stroke="#89776b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M198 160H224"/><path d="M410 160H436"/><path d="M622 160H648"/><path d="M834 160H860"/></g>
<g stroke="#d8d0c4">
<rect x="40" y="112" width="158" height="118" rx="13" fill="#e7e3d8"/>
<rect x="232" y="112" width="178" height="118" rx="13" fill="#f3e0d5"/>
<rect x="444" y="112" width="178" height="118" rx="13" fill="#f3e0d5"/>
<rect x="656" y="112" width="178" height="118" rx="13" fill="#e1e8ed"/>
<rect x="868" y="112" width="190" height="118" rx="13" fill="#e6eadb"/>
</g>
<g font-size="21" font-weight="600" text-anchor="middle"><text x="119" y="151">全库</text><text x="321" y="151">召回</text><text x="533" y="151">粗排</text><text x="745" y="151">精排</text><text x="963" y="151">重排 → 展示</text></g>
<g font-size="16" text-anchor="middle" fill="#5b5148"><text x="119" y="183">1,000 万条</text><text x="321" y="183">4,000 个候选</text><text x="533" y="183">保留 400 个</text><text x="745" y="183">丰富特征与多目标</text><text x="963" y="183">20 个位置</text><text x="119" y="210">内容与可用性</text><text x="321" y="210">多通道、去重、过滤</text><text x="533" y="210">便宜地做取舍</text><text x="745" y="210">逐物品预测价值</text><text x="963" y="210">多样性、位置约束</text></g>
<path d="M963 236V288H738" fill="none" stroke="#89776b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="360" y="270" width="368" height="64" rx="12" fill="#fffaf2" stroke="#d8d0c4"/>
<text x="544" y="296" text-anchor="middle" font-size="18" font-weight="600">曝光与交互日志 → 训练、索引、A/B</text>
<text x="544" y="320" text-anchor="middle" font-size="15" fill="#74695f">事件口径、时间切分、版本与保护指标</text>
<path d="M360 302H321V237" fill="none" stroke="#89776b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="42" y="381" font-size="16" fill="#74695f">检查每个漏斗：好内容在哪一层消失？数量为教学示意，未表示平台真实参数。</text>
</g></svg>

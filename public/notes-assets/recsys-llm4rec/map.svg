<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">推荐与 LLM4Rec 知识地图</title>
<desc id="desc">左列是经典链路：召回、排序、重排与冷启动；中列是规模变大后的序列与长序列建模、可扩展排序；右列是语义 ID 与 LLM4Rec。底部三块贯穿全部：评估与偏差、多模态与 I2I、广告与业务。</desc>
